---
# Integration test for the 2026-07-21 "dict object has no attribute 'rc'"
# regression in roles/nfs_setup/tasks/main.yml.
#
# Symptom (from ubuntu@hs-quorum-ans, 2 OCI instances):
#   TASK [nfs_setup : Display sunrpc pool_mode status]
#   fatal: [instance...]: FAILED! =>
#     The task includes an option with an undefined variable..
#     'dict object' has no attribute 'rc'
#     line 121 ... - name: Display sunrpc pool_mode status
#   PLAY RECAP ... failed=1   (everything else ok)
#
# Cause: the "Unload NFS and sunrpc modules" task registers `sunrpc_unload`
# INSIDE a block guarded by a `when` (not check_mode / pool_mode already set /
# node_already_in_hammerspace). When that block is skipped, Ansible pushes the
# condition to each child task and skips it — but a skipped task that has a
# `register:` STILL defines the variable, as a skipped-result dict:
#     {"changed": false, "skipped": true, "skip_reason": "..."}
# which has NO `rc` key.
#
# The Display task (OUTSIDE the block) then evaluated:
#     {% elif sunrpc_unload is defined and sunrpc_unload.rc | default(0) != 0 %}
# `sunrpc_unload is defined` is True (skipped dict), but `sunrpc_unload.rc`
# hard-fails with 'dict object has no attribute rc' at access time and
# `| default(0)` never runs — `default` only substitutes a lazy Undefined,
# not this access error.
#
# Fix: guard the attribute itself before comparing:
#     {% elif sunrpc_unload is defined and sunrpc_unload.rc is defined
#             and sunrpc_unload.rc != 0 %}
#
# This test simulates the three relevant states of `sunrpc_unload` (skipped
# dict, successful run rc=0, failed run rc=1) plus "never defined", and
# renders the exact status-branch logic to confirm:
#   - the OLD expression raises on the skipped dict, and
#   - the NEW expression is safe for all four states and picks the right branch.
#
# Usage:
#   ansible-playbook tests/integration/test_nfs_sunrpc_status.yml \
#       -i localhost, -c local

- name: nfs_setup sunrpc pool_mode status regression test
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars:
    _test_passes: []
    _test_failures: []

    # The exact status-branch template from the fixed Display task. Renders to
    # one of: OK / REBOOT / SAVED / UNKNOWN so tests can assert the branch.
    _status_tmpl: >-
      {%- if pool_mode | default('unknown') == 'pernode' -%}OK
      {%- elif sunrpc_unload is defined and sunrpc_unload.rc is defined and sunrpc_unload.rc != 0 -%}REBOOT
      {%- else -%}SAVED
      {%- endif -%}

    # A skipped task with `register:` produces this shape — note: NO `rc`.
    _sunrpc_unload_skipped:
      changed: false
      skipped: true
      skip_reason: "Conditional result was False"

  tasks:
    # ========================================================================
    # TEST 1: the root-cause invariant — a skipped task's registered result is
    # a DEFINED dict that has NO `rc` key. This is what breaks the OLD guard:
    # `sunrpc_unload is defined` is True while `sunrpc_unload.rc` is missing.
    # On strict ansible-core versions the OLD `sunrpc_unload.rc | default(0)`
    # hard-fails ('dict object has no attribute rc') before `default` runs; on
    # lenient versions it happens to survive. So we assert the structural fact
    # (version-independent) rather than whether the OLD expression raises.
    # ========================================================================
    - name: 'TEST 1: skipped register result is defined but has no rc'
      block:
        - name: 'TEST 1 ASSERT: skipped dict is defined, .rc is not'
          ansible.builtin.assert:
            that:
              - _sunrpc_unload_skipped is defined
              - _sunrpc_unload_skipped.skipped | default(false)
              - "'rc' not in _sunrpc_unload_skipped"
              - _sunrpc_unload_skipped.rc is not defined
            fail_msg: |
              A skipped register result should be a defined dict WITHOUT an rc
              key. Got: {{ _sunrpc_unload_skipped }}

        - name: Record TEST 1 pass
          ansible.builtin.set_fact:
            _test_passes: "{{ _test_passes + ['TEST 1: skipped register result is defined but lacks rc (root cause)'] }}"
      rescue:
        - name: Record TEST 1 failure
          ansible.builtin.set_fact:
            _test_failures: "{{ _test_failures + ['TEST 1: ' ~ (ansible_failed_result.msg | default('unknown'))] }}"

    # ========================================================================
    # TEST 2: the FIX — NEW expression + skipped dict must NOT raise and must
    # fall through to SAVED (block was skipped → config saved for next reboot).
    # ========================================================================
    - name: 'TEST 2: NEW expression is safe on the skipped dict → SAVED'
      block:
        - name: Render NEW template against the skipped dict
          ansible.builtin.set_fact:
            _new_render: "{{ _status_tmpl }}"
          vars:
            pool_mode: "tasks"
            sunrpc_unload: "{{ _sunrpc_unload_skipped }}"

        - name: 'TEST 2 ASSERT: renders SAVED, no crash'
          ansible.builtin.assert:
            that:
              - _new_render == 'SAVED'
            fail_msg: "NEW expression should render SAVED for a skipped dict, got: {{ _new_render }}"

        - name: Record TEST 2 pass
          ansible.builtin.set_fact:
            _test_passes: "{{ _test_passes + ['TEST 2: NEW expression safe on skipped dict → SAVED'] }}"
      rescue:
        - name: Record TEST 2 failure
          ansible.builtin.set_fact:
            _test_failures: "{{ _test_failures + ['TEST 2: ' ~ (ansible_failed_result.msg | default('unknown'))] }}"

    # ========================================================================
    # TEST 3: block ran and unload succeeded (rc=0) → still SAVED (config
    # applied on the running system; reboot not required).
    # ========================================================================
    - name: 'TEST 3: NEW expression with rc=0 → SAVED'
      block:
        - name: Render NEW template with a successful unload
          ansible.builtin.set_fact:
            _new_render_rc0: "{{ _status_tmpl }}"
          vars:
            pool_mode: "tasks"
            sunrpc_unload: {changed: true, rc: 0, stdout: "sunrpc unloaded successfully"}

        - name: 'TEST 3 ASSERT: renders SAVED'
          ansible.builtin.assert:
            that:
              - _new_render_rc0 == 'SAVED'
            fail_msg: "rc=0 should render SAVED, got: {{ _new_render_rc0 }}"

        - name: Record TEST 3 pass
          ansible.builtin.set_fact:
            _test_passes: "{{ _test_passes + ['TEST 3: NEW expression with rc=0 → SAVED'] }}"
      rescue:
        - name: Record TEST 3 failure
          ansible.builtin.set_fact:
            _test_failures: "{{ _test_failures + ['TEST 3: ' ~ (ansible_failed_result.msg | default('unknown'))] }}"

    # ========================================================================
    # TEST 4: block ran but unload FAILED (rc=1, sunrpc still loaded / active
    # mounts) → REBOOT REQUIRED. This is the branch the elif exists to detect,
    # and it must still fire after the fix.
    # ========================================================================
    - name: 'TEST 4: NEW expression with rc=1 → REBOOT'
      block:
        - name: Render NEW template with a failed unload
          ansible.builtin.set_fact:
            _new_render_rc1: "{{ _status_tmpl }}"
          vars:
            pool_mode: "tasks"
            sunrpc_unload: {changed: true, rc: 1, stdout: "sunrpc still loaded - may have active mounts"}

        - name: 'TEST 4 ASSERT: renders REBOOT'
          ansible.builtin.assert:
            that:
              - _new_render_rc1 == 'REBOOT'
            fail_msg: "rc=1 should render REBOOT, got: {{ _new_render_rc1 }}"

        - name: Record TEST 4 pass
          ansible.builtin.set_fact:
            _test_passes: "{{ _test_passes + ['TEST 4: NEW expression with rc=1 → REBOOT (branch still fires)'] }}"
      rescue:
        - name: Record TEST 4 failure
          ansible.builtin.set_fact:
            _test_failures: "{{ _test_failures + ['TEST 4: ' ~ (ansible_failed_result.msg | default('unknown'))] }}"

    # ========================================================================
    # TEST 5: sunrpc_unload never defined (block short-circuited before the
    # register, e.g. node_already_in_hammerspace path) AND pool_mode already
    # pernode → OK. Confirms the `is defined` guard short-circuits cleanly.
    # ========================================================================
    - name: 'TEST 5: sunrpc_unload undefined + pool_mode pernode → OK'
      block:
        - name: Render NEW template with pernode and no sunrpc_unload
          ansible.builtin.set_fact:
            _new_render_ok: "{{ _status_tmpl }}"
          vars:
            pool_mode: "pernode"

        - name: 'TEST 5 ASSERT: renders OK'
          ansible.builtin.assert:
            that:
              - _new_render_ok == 'OK'
            fail_msg: "pernode should render OK, got: {{ _new_render_ok }}"

        - name: Record TEST 5 pass
          ansible.builtin.set_fact:
            _test_passes: "{{ _test_passes + ['TEST 5: undefined sunrpc_unload + pernode → OK (no crash)'] }}"
      rescue:
        - name: Record TEST 5 failure
          ansible.builtin.set_fact:
            _test_failures: "{{ _test_failures + ['TEST 5: ' ~ (ansible_failed_result.msg | default('unknown'))] }}"

    # ========================================================================
    # Report
    # ========================================================================
    - name: Print test report
      ansible.builtin.debug:
        msg: |
          ============================================================
          NFS SUNRPC POOL_MODE STATUS REGRESSION TEST REPORT
          ============================================================
          PASSED ({{ _test_passes | length }}):
          {% for t in _test_passes %}
            ✓ {{ t }}
          {% endfor %}

          {% if _test_failures | length > 0 %}
          FAILED ({{ _test_failures | length }}):
          {% for t in _test_failures %}
            ✗ {{ t }}
          {% endfor %}
          {% else %}
          FAILED: 0
          {% endif %}
          ============================================================

    - name: Fail the play if any test failed
      ansible.builtin.fail:
        msg: "{{ _test_failures | length }} test(s) failed."
      when: _test_failures | length > 0
