---
# Tests for optional Azure Key Vault retrieval of the Hammerspace admin
# password (roles/hammerspace_integration/tasks/keyvault_password.yml).
#
# Sites that already manage secrets in Key Vault do not want a password file on
# the scheduler. Setting hammerspace_keyvault_uri pulls the password at run time
# and overrides vars/vault.yml; leaving it unset changes nothing.
#
# The high-stakes property here is SECRECY, not function: the lookup result
# holds the plaintext admin password, and scripts/run.sh sends every run to a
# log file under ~/logs. A missing no_log would write the cluster admin
# password to disk on every deployment. TEST 3 audits that specifically.
#
# The live Key Vault call cannot run in CI (needs Azure credentials and a real
# vault), so these tests cover the wiring, the guards and the secrecy
# properties. The lookup itself is exercised by running against a real vault.
#
# Usage:
#   ansible-playbook tests/integration/test_keyvault_password.yml \
#       -i localhost, -c local

- name: Azure Key Vault password retrieval tests
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars:
    _test_passes: []
    _test_failures: []

  tasks:
    # ========================================================================
    # TEST 1: opt-in — unset means completely inert
    # ========================================================================
    - name: 'TEST 1: unset hammerspace_keyvault_uri leaves the password alone'
      block:
        - name: Simulate a vars/vault.yml-sourced password
          ansible.builtin.set_fact:
            hammerspace_api_password: "from-vault-file"

        - name: Include the role exactly as the plays do
          ansible.builtin.include_role:
            name: hammerspace_integration
            tasks_from: keyvault_password
          when: (hammerspace_keyvault_uri | default('')) | length > 0

        - name: 'TEST 1 ASSERT: password is untouched'
          ansible.builtin.assert:
            that:
              - hammerspace_api_password == 'from-vault-file'
            fail_msg: |
              REGRESSION: the Key Vault path ran (or altered the password) even
              though hammerspace_keyvault_uri is unset. This feature must be
              inert by default — every existing deployment relies on
              vars/vault.yml.

        - name: Record TEST 1 pass
          ansible.builtin.set_fact:
            _test_passes: "{{ _test_passes + ['TEST 1: unset keyvault_uri is inert; vars/vault.yml password survives'] }}"
      rescue:
        - name: Record TEST 1 failure
          ansible.builtin.set_fact:
            _test_failures: "{{ _test_failures + ['TEST 1: ' ~ (ansible_failed_result.msg | default('unknown') | replace('\n', ' '))] }}"

    # ========================================================================
    # TEST 2: URI without secret name must fail with a usable message, not an
    # obscure module error about a missing required argument.
    # ========================================================================
    - name: 'TEST 2: keyvault_uri without secret_name is refused clearly'
      block:
        - name: Set only the vault URI
          ansible.builtin.include_role:
            name: hammerspace_integration
            tasks_from: keyvault_password
          vars:
            hammerspace_keyvault_uri: "https://example-vault.vault.azure.net"

        - name: 'TEST 2 FAIL: half-configured Key Vault was accepted'
          ansible.builtin.set_fact:
            _test_failures: "{{ _test_failures + ['TEST 2: hammerspace_keyvault_uri without secret_name did NOT fail — the module would raise an obscure error instead'] }}"
      rescue:
        - name: 'TEST 2 ASSERT: the failure names the missing variable'
          ansible.builtin.assert:
            that:
              - "'hammerspace_keyvault_secret_name' in (ansible_failed_result.msg | default(''))"
            fail_msg: |
              The guard fired but its message does not name
              hammerspace_keyvault_secret_name, so an operator cannot tell what
              to set. Got: {{ ansible_failed_result.msg | default('') }}

        - name: Record TEST 2 pass
          ansible.builtin.set_fact:
            _test_passes: "{{ _test_passes + ['TEST 2: keyvault_uri without secret_name fails and names the missing var'] }}"

    # ========================================================================
    # TEST 3 (audit): SECRECY. Every task that can observe the secret must
    # carry no_log, and the confirmation message must not print the value.
    # ========================================================================
    - name: 'TEST 3: audit no_log coverage on the Key Vault path'
      block:
        - name: Read the task file
          ansible.builtin.slurp:
            src: "{{ playbook_dir }}/../../roles/hammerspace_integration/tasks/keyvault_password.yml"
          register: _kv_src

        - name: Decode and split into task blocks
          ansible.builtin.set_fact:
            _kv_raw: "{{ _kv_src.content | b64decode }}"

        - name: 'TEST 3 ASSERT: the lookup and the set_fact both carry no_log'
          ansible.builtin.assert:
            that:
              # The module call returns the plaintext secret.
              - "'azure_rm_keyvaultsecret_info' in _kv_raw"
              # Quoted: the pattern contains ': ', which YAML would otherwise
              # parse as a mapping rather than a conditional string.
              # At minimum the lookup task and the set_fact that consumes it.
              - "(_kv_raw | regex_findall('no_log: true')) | length >= 2"
            fail_msg: |
              REGRESSION: fewer than two no_log declarations on the Key Vault
              path. The module result and the set_fact that reads
              .secrets[0].secret both expose the plaintext admin password —
              scripts/run.sh logs every run to ~/logs, so a missing no_log
              writes the cluster password to disk on every deployment.

        - name: 'TEST 3 ASSERT: the confirmation message never prints the secret'
          ansible.builtin.assert:
            that:
              # Reporting length is fine; interpolating the value is not.
              - "'hammerspace_api_password | length' in _kv_raw"
              # _bare is assembled from fragments so this file does not itself
              # contain the literal expression — Ansible would template it and
              # the test would compare against the real password.
              - "_bare not in _kv_raw"
            fail_msg: |
              REGRESSION: the Key Vault task file interpolates the password
              into a message. Report its LENGTH to confirm retrieval, never the
              value.
          vars:
            _bare: "{{ '{' ~ '{ hammerspace_api_password }' ~ '}' }}"

        - name: Record TEST 3 pass
          ansible.builtin.set_fact:
            _test_passes: "{{ _test_passes + ['TEST 3: audit — no_log on lookup + set_fact, and the secret is never interpolated into output'] }}"
      rescue:
        - name: Record TEST 3 failure
          ansible.builtin.set_fact:
            _test_failures: "{{ _test_failures + ['TEST 3: ' ~ (ansible_failed_result.msg | default('unknown') | replace('\n', ' '))] }}"

    # ========================================================================
    # TEST 4 (audit): every play that loads vars/vault.yml must also offer the
    # Key Vault path, or the password silently comes from different places
    # depending on which playbook you run. Same class as the 2026-08-25 vault
    # incident that test_vault_loading.yml covers.
    # ========================================================================
    - name: 'TEST 4: audit Key Vault hook coverage across all plays'
      block:
        - name: Find playbooks that load the vault file
          ansible.builtin.shell:
            cmd: >-
              cd {{ (playbook_dir ~ '/../..') | quote }} &&
              grep -rl "vars/vault.yml" plays/*.yml *.yml 2>/dev/null | sort -u
          register: _vault_users
          changed_when: false
          # Source audit, not a change. Without this the task is
          # SKIPPED under --check, stdout is empty, and the assert
          # below reads that as a regression. (2026-08-26 rule.)
          check_mode: false

        - name: Find playbooks that wire in the Key Vault hook
          ansible.builtin.shell:
            cmd: >-
              cd {{ (playbook_dir ~ '/../..') | quote }} &&
              grep -rl "tasks_from: keyvault_password" plays/*.yml *.yml 2>/dev/null | sort -u
          register: _kv_users
          changed_when: false
          # Source audit, not a change. Without this the task is
          # SKIPPED under --check, stdout is empty, and the assert
          # below reads that as a regression. (2026-08-26 rule.)
          check_mode: false

        - name: 'TEST 4 ASSERT: no play loads the vault without the KV option'
          ansible.builtin.assert:
            that:
              - _missing | length == 0
            fail_msg: |
              REGRESSION: {{ _missing | length }} playbook(s) load vars/vault.yml
              but have no Azure Key Vault hook, so the admin password would come
              from a different source depending on which playbook is run:
              {{ _missing | join(', ') }}
          vars:
            _missing: >-
              {{ (_vault_users.stdout_lines | default([]))
                 | difference(_kv_users.stdout_lines | default([])) }}

        - name: Record TEST 4 pass
          ansible.builtin.set_fact:
            _test_passes: "{{ _test_passes + ['TEST 4: audit — all ' ~ (_vault_users.stdout_lines | length) ~ ' vault-loading playbooks offer the Key Vault path'] }}"
      rescue:
        - name: Record TEST 4 failure
          ansible.builtin.set_fact:
            _test_failures: "{{ _test_failures + ['TEST 4: ' ~ (ansible_failed_result.msg | default('unknown') | replace('\n', ' '))] }}"

    # ========================================================================
    # TEST 5 (audit): DIAGNOSABILITY. `no_log: true` censors the entire task
    # result, failures included, so a lookup that failed on auth or RBAC
    # aborted the play with only:
    #
    #   fatal: [10.0.0.5 -> localhost]: FAILED! =>
    #     censored: 'the output has been hidden due to the fact that
    #     ''no_log: true'' was specified for this result'
    #
    # Nothing about WHY. The module must therefore never fail the play itself
    # (failed_when: false) — a following task reports the real error, since it
    # runs only on the failure path where no secret was returned.
    #
    # Same class as the 2026-08-26 blank diagnostics block: a safety/secrecy
    # measure that made the log undiagnosable.
    # ========================================================================
    - name: 'TEST 5: audit — a failed Key Vault lookup reports the real error'
      block:
        # Re-read rather than reusing TEST 3's _kv_raw, so this test does not
        # silently pass on a stale fact if TEST 3 is reordered or its slurp
        # fails.
        - name: Read the task file
          ansible.builtin.slurp:
            src: "{{ playbook_dir }}/../../roles/hammerspace_integration/tasks/keyvault_password.yml"
          register: _kv_src5

        - name: Decode the task file
          ansible.builtin.set_fact:
            _kv_raw: "{{ _kv_src5.content | b64decode }}"

        - name: 'TEST 5 ASSERT: the lookup cannot abort the play while censored'
          ansible.builtin.assert:
            that:
              # Quoted: these patterns contain ': ', which YAML would otherwise
              # parse as a mapping rather than a conditional string.
              - "'failed_when: false' in _kv_raw"
              # The diagnostic must read the module's own message, not invent
              # a generic one.
              - "'_hs_kv_secret.msg' in _kv_raw"
              # ...and must be gated on the failure path only.
              - "'_hs_kv_secret.failed' in _kv_raw"
            fail_msg: |
              REGRESSION: the Key Vault lookup can fail the play while its
              output is censored by no_log. An operator then sees only
              "the output has been hidden due to the fact that no_log: true
              was specified for this result" and cannot tell an auth failure
              from a missing role assignment from a wrong vault URI.

              Required: failed_when: false on the module task, plus a
              following fail task gated on _hs_kv_secret.failed that prints
              _hs_kv_secret.msg.

        - name: 'TEST 5 ASSERT: the diagnostic itself is not censored'
          ansible.builtin.assert:
            that:
              # The failure report must NOT carry no_log, or the fix is inert.
              # Exactly two no_log declarations are expected on this path: the
              # lookup and the set_fact. A third means one landed on the
              # diagnostic.
              - "(_kv_raw | regex_findall('no_log: true')) | length == 2"
            fail_msg: |
              The Key Vault path declares
              {{ (_kv_raw | regex_findall('no_log: true')) | length }} no_log
              tasks; expected exactly 2 (the module lookup and the set_fact
              that reads .secrets[0].secret). A third suppresses the failure
              diagnostic and restores the undiagnosable log; fewer means the
              plaintext password reaches ~/logs.

        - name: 'TEST 5 ASSERT: the error names the causes an operator can act on'
          ansible.builtin.assert:
            that:
              - "'Key Vault Secrets User' in _kv_raw"
              - "'az keyvault secret show' in _kv_raw"
              - "'hammerspace_keyvault_auth_source' in _kv_raw"
            fail_msg: |
              The Key Vault failure message must point at the actual causes —
              auth_source (msi vs cli), the "Key Vault Secrets User" role, and
              an `az keyvault secret show` command to reproduce outside
              Ansible. Without those the operator is back to guessing.

        - name: Record TEST 5 pass
          ansible.builtin.set_fact:
            _test_passes: "{{ _test_passes + ['TEST 5: audit — a failed lookup surfaces the Azure error instead of a censored result'] }}"
      rescue:
        - name: Record TEST 5 failure
          ansible.builtin.set_fact:
            _test_failures: "{{ _test_failures + ['TEST 5: ' ~ (ansible_failed_result.msg | default('unknown') | replace('\n', ' '))] }}"

    # ========================================================================
    # TEST 6: the vault URI is normalized, and the bare vault name is derived
    # from it. Operators copy the URI out of the portal, which renders it WITH
    # a trailing slash; the derived name feeds the `az` commands in the failure
    # messages, so a placeholder there would send them back to guessing.
    # ========================================================================
    - name: 'TEST 6: vault URI normalization and name derivation'
      block:
        - name: Derive the facts the role derives
          ansible.builtin.set_fact:
            _hs_kv_uri: "{{ _case | regex_replace('/+$', '') }}"
            _hs_kv_vault_name: >-
              {{ _case
                 | regex_replace('^https?://', '')
                 | regex_replace('/.*$', '')
                 | regex_replace('\..*$', '') }}
          loop:
            - "https://hpcs-kv-swe-poc-ham.vault.azure.net/"
            - "https://hpcs-kv-swe-poc-ham.vault.azure.net"
          loop_control:
            loop_var: _case
          register: _norm

        - name: 'TEST 6 ASSERT: both spellings collapse to the same URI and name'
          ansible.builtin.assert:
            that:
              - _uris | unique | length == 1
              - _uris | first == 'https://hpcs-kv-swe-poc-ham.vault.azure.net'
              - _names | unique | length == 1
              - _names | first == 'hpcs-kv-swe-poc-ham'
            fail_msg: |
              Vault URI normalization is broken.
                URIs:  {{ _uris }}
                names: {{ _names }}
              A trailing slash is how the Azure portal renders the URI, so it
              must not reach the SDK or the az hints.
          vars:
            _uris: "{{ _norm.results | map(attribute='ansible_facts._hs_kv_uri') | list }}"
            _names: "{{ _norm.results | map(attribute='ansible_facts._hs_kv_vault_name') | map('trim') | list }}"

        - name: Read the task file
          ansible.builtin.slurp:
            src: "{{ playbook_dir }}/../../roles/hammerspace_integration/tasks/keyvault_password.yml"
          register: _kv_src6

        - name: Decode the task file
          ansible.builtin.set_fact:
            _kv_raw6: "{{ _kv_src6.content | b64decode }}"

        - name: 'TEST 6 ASSERT: the module is handed the normalized URI'
          ansible.builtin.assert:
            that:
              - _expected in _kv_raw6
            fail_msg: |
              The azure_rm_keyvaultsecret_info task must be given _hs_kv_uri,
              not the raw hammerspace_keyvault_uri, or the normalization is
              computed and then ignored.
          vars:
            # Assembled from fragments so this file does not itself contain a
            # live template expression — same trick as TEST 3's _bare.
            _expected: "{{ 'vault_uri: \"' ~ '{' ~ '{ _hs_kv_uri }' ~ '}' ~ '\"' }}"

        - name: 'TEST 6 ASSERT: a 404 sends the operator to `secret list`'
          ansible.builtin.assert:
            that:
              # `secret show` reproduces the same 404 and adds nothing; listing
              # the vault is what actually resolves a name mismatch.
              - "'az keyvault secret list' in _kv_raw6"
              - "'list-deleted' in _kv_raw6"
              # The 404 branch must NOT re-blame permissions: a 403 fails the
              # retrieval task instead, so RBAC is already proven working.
              - "'Authentication and permissions are NOT the problem' in _kv_raw6"
            fail_msg: |
              The not-found message must send the operator to
              `az keyvault secret list` (and list-deleted), and must state that
              permissions are already proven — azure_rm_keyvaultsecret_info
              swallows only ResourceNotFoundError, so reaching that branch
              means a real 404, never a 403.

        - name: 'TEST 6 ASSERT: no <vault> placeholder survives in the hints'
          ansible.builtin.assert:
            that:
              - "'--vault-name <vault>' not in _kv_raw6"
            fail_msg: |
              A literal '--vault-name <vault>' placeholder remains. The vault
              name is derivable from the URI; make the command copy-pasteable.

        - name: Record TEST 6 pass
          ansible.builtin.set_fact:
            _test_passes: "{{ _test_passes + ['TEST 6: vault URI normalized, name derived, 404 message points at `secret list`'] }}"
      rescue:
        - name: Record TEST 6 failure
          ansible.builtin.set_fact:
            _test_failures: "{{ _test_failures + ['TEST 6: ' ~ (ansible_failed_result.msg | default('unknown') | replace('\n', ' '))] }}"

    # ========================================================================
    # Report
    # ========================================================================
    - name: Print test report
      ansible.builtin.debug:
        msg: |
          ============================================================
          AZURE KEY VAULT PASSWORD TEST REPORT
          ============================================================
          PASSED ({{ _test_passes | length }}):
          {% for t in _test_passes %}
            ✓ {{ t }}
          {% endfor %}

          {% if _test_failures | length > 0 %}
          FAILED ({{ _test_failures | length }}):
          {% for t in _test_failures %}
            ✗ {{ t }}
          {% endfor %}
          {% else %}
          FAILED: 0
          {% endif %}
          ============================================================

    - name: Fail the play if any test failed
      ansible.builtin.fail:
        msg: "{{ _test_failures | length }} test(s) failed."
      when: _test_failures | length > 0
