---
# Tests for existing-mount mode: use filesystems that are ALREADY built and
# mounted instead of discovering disks and building RAID. The playbook creates
# one export directory inside each mounted path and wires NFS + Hammerspace
# around it, touching nothing else.
#
# Two things in this mode are easy to get wrong and silent when you do:
#
#   1. The `mp` export option means "only export this path if it is itself a
#      mountpoint". An export SUBDIRECTORY is not one, so leaving `mp` in place
#      produces NO export at all — /etc/exports looks right, showmount comes
#      back empty. It must become mountpoint=<parent mount>, which keeps the
#      "do not export if the array is unmounted" guarantee.
#   2. filesystem_setup runs mkfs against every mount_points entry. If it is
#      not skipped in this mode it reformats the very filesystem the operator
#      asked to reuse.
#
# Usage:
#   ansible-playbook tests/integration/test_existing_mounts.yml \
#       -i localhost, -c local

- name: Existing-mount mode tests
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars:
    _test_passes: []
    _test_failures: []

    hammerspace_export_opts: "rw,no_root_squash,sync,secure,mp,no_subtree_check"
    client_export_opts: "rw,root_squash,sync,secure,mp,no_subtree_check"

    # Two exports: a subdirectory (needs mountpoint=) and a bare mountpoint
    # (keeps mp), so both branches are exercised.
    _mp_mock:
      - path: /mnt/raid0/tier0
        parent_mount: /mnt/raid0
      - path: /mnt/raid1
        parent_mount: /mnt/raid1

  tasks:
    # ========================================================================
    # TEST 1: the `mp` -> mountpoint= swap
    # ========================================================================
    - name: 'TEST 1: mp is replaced with mountpoint= for subdirectory exports'
      block:
        - name: Compute export options the way existing_mounts.yml does
          ansible.builtin.set_fact:
            _opts: >-
              {{ _opts | default([]) + [{
                   'path': item.path,
                   'options': (hammerspace_export_opts
                               if item.path == item.parent_mount
                               else (hammerspace_export_opts.split(',')
                                     | reject('equalto', 'mp') | list
                                     + ['mountpoint=' ~ item.parent_mount]) | join(','))
                 }] }}
          loop: "{{ _mp_mock }}"
          loop_control:
            label: "{{ item.path }}"

        - name: 'TEST 1 ASSERT: subdir export drops mp and pins mountpoint='
          ansible.builtin.assert:
            that:
              - "'mp' not in (_opts[0].options.split(','))"
              - "'mountpoint=/mnt/raid0' in _opts[0].options"
              # the rest of the options must survive untouched
              - "'no_root_squash' in _opts[0].options"
              - "'no_subtree_check' in _opts[0].options"
            fail_msg: |
              REGRESSION: a subdirectory export kept the bare `mp` option, or
              lost mountpoint=. With `mp` on a non-mountpoint the export is
              silently DROPPED — /etc/exports looks correct and showmount
              returns nothing.
              Got: {{ _opts[0].options }}

        - name: 'TEST 1 ASSERT: a bare mountpoint export keeps mp untouched'
          ansible.builtin.assert:
            that:
              - "'mp' in (_opts[1].options.split(','))"
              - "'mountpoint=' not in _opts[1].options"
            fail_msg: |
              When subdir is '' the export path IS the mountpoint, so plain `mp`
              is correct and must be left alone.
              Got: {{ _opts[1].options }}

        - name: Record TEST 1 pass
          ansible.builtin.set_fact:
            _test_passes: "{{ _test_passes + ['TEST 1: mp -> mountpoint= for subdir exports; mp kept for mountpoint exports'] }}"
      rescue:
        - name: Record TEST 1 failure
          ansible.builtin.set_fact:
            _test_failures: "{{ _test_failures + ['TEST 1: ' ~ (ansible_failed_result.msg | default('unknown') | replace('\n', ' '))] }}"

    # ========================================================================
    # TEST 2: path normalisation, including the '/' edge case
    # ========================================================================
    - name: 'TEST 2: export paths normalise correctly'
      block:
        - name: Normalise a range of entry shapes
          ansible.builtin.set_fact:
            _norm: >-
              {{ _norm | default([]) + [{
                   'in': item.p,
                   'path': _p,
                   'export_path': ((_p ~ '/' ~ item.s)
                                   | regex_replace('//+', '/')
                                   | regex_replace('/+$', ''))
                                  | default(_p, true)
                 }] }}
          loop:
            - {p: '/mnt/raid0', s: 'tier0'}     # plain
            - {p: '/mnt/raid0/', s: 'tier0'}    # trailing slash
            - {p: '/mnt/raid0', s: ''}          # no subdir -> the mount itself
            - {p: '/', s: 'tier0'}              # root (refused later, but must not blank out)
          loop_control:
            label: "{{ item.p }} + {{ item.s }}"
          vars:
            _p: "{{ (item.p | regex_replace('/+$', '')) | default(item.p, true) }}"

        - name: 'TEST 2 ASSERT: normalisation is correct in every case'
          ansible.builtin.assert:
            that:
              - _norm[0].export_path == '/mnt/raid0/tier0'
              - _norm[1].export_path == '/mnt/raid0/tier0'
              - _norm[2].export_path == '/mnt/raid0'
              # '/' | regex_replace('/+$','') is the EMPTY string. Without the
              # default(x, true) guard the refusal message printed '' and the
              # export path collapsed.
              - _norm[3].path == '/'
              - _norm[3].export_path == '/tier0'
            fail_msg: "Normalisation regression: {{ _norm }}"

        - name: Record TEST 2 pass
          ansible.builtin.set_fact:
            _test_passes: "{{ _test_passes + ['TEST 2: path normalisation handles trailing slash, empty subdir and /'] }}"
      rescue:
        - name: Record TEST 2 failure
          ansible.builtin.set_fact:
            _test_failures: "{{ _test_failures + ['TEST 2: ' ~ (ansible_failed_result.msg | default('unknown') | replace('\n', ' '))] }}"

    # ========================================================================
    # TEST 3: system mountpoints are refused (runs the real task file)
    # ========================================================================
    - name: 'TEST 3: a system mountpoint is refused'
      block:
        - name: Point existing-mount mode at /
          ansible.builtin.include_role:
            name: nvme_discovery
            tasks_from: existing_mounts
          vars:
            existing_mount_paths: ['/']

        - name: 'TEST 3 FAIL: / was accepted as Tier 0 storage'
          ansible.builtin.set_fact:
            _test_failures: "{{ _test_failures + ['TEST 3: / was ACCEPTED as Tier 0 storage (REGRESSION — would export the OS over NFS with no_root_squash)'] }}"
      rescue:
        - name: 'TEST 3 PASS: refusal fired'
          ansible.builtin.set_fact:
            _test_passes: "{{ _test_passes + ['TEST 3: system mountpoint / refused before anything is created'] }}"

    # ========================================================================
    # TEST 4 (audit): the destructive roles must be gated off in this mode
    # ========================================================================
    - name: 'TEST 4: audit mode wiring'
      block:
        - name: Read the play and task sources
          ansible.builtin.slurp:
            src: "{{ playbook_dir }}/../../{{ item }}"
          register: _srcs
          loop:
            - plays/storage.yml
            - vars/main.yml
            - roles/nvme_discovery/tasks/existing_mounts.yml

        - name: Decode sources
          ansible.builtin.set_fact:
            _play: "{{ _srcs.results[0].content | b64decode }}"
            _vars: "{{ _srcs.results[1].content | b64decode }}"
            _task: "{{ _srcs.results[2].content | b64decode }}"

        - name: Strip comments from the play for the behavioural audit
          ansible.builtin.set_fact:
            _play_code: "{{ _play.split('\n') | reject('match', '\\s*#') | join('\n') }}"
            # The task file's header DESCRIBES what it must never do ("no mkfs,
            # no mdadm..."), so the audit has to read code, not prose.
            _task_code: "{{ _task.split('\n') | reject('match', '\\s*#') | join('\n') }}"

        - name: 'TEST 4 ASSERT: mode ships off by default'
          ansible.builtin.assert:
            that:
              - "'existing_mount_paths: []' in _vars"
            fail_msg: "existing_mount_paths must default to [] so the mode is opt-in."

        - name: 'TEST 4 ASSERT: filesystem_setup and raid_setup are gated off'
          ansible.builtin.assert:
            that:
              # filesystem_setup runs mkfs against every mount_points entry — in
              # this mode that would reformat the operator's existing array.
              - _play_code.count('existing_mount_paths | default([]) | length == 0') >= 3
              - "'role: filesystem_setup' in _play_code"
            fail_msg: |
              REGRESSION: existing-mount mode must gate OFF nvme_discovery,
              raid_setup and filesystem_setup. filesystem_setup in particular
              runs mkfs over mount_points — leaving it enabled reformats the
              filesystem the operator asked to reuse.

        - name: 'TEST 4 ASSERT: the task file never formats or mounts'
          ansible.builtin.assert:
            that:
              - "'mkfs' not in _task_code"
              - "'wipefs' not in _task_code"
              - "'mdadm' not in _task_code"
              - "'ansible.posix.mount' not in _task_code"
            fail_msg: |
              REGRESSION: existing_mounts.yml must never format, wipe, assemble
              or mount anything. Its only write is mkdir of the export directory.

        # 2026-08-27: generalising _precheck_hw_raid to also mean existing-mount
        # mode made the HW-RAID summary render in a mode where hw_raid_devices
        # is undefined:
        #   TASK [precheck : Validation summary (HW RAID mode)]
        #   'hw_raid_devices' is undefined
        # Any reference to a mode-specific var in a task shared by both modes
        # must be guarded.
        # 2026-08-27: the gates were added to plays/storage.yml only. A SECOND
        # entry point, site-onprem-nvme.yml, has its own roles list and ran
        # raid_setup + filesystem_setup ungated — the latter would have run
        # mkfs against /nvme/tier0's device and destroyed the array. Every
        # playbook that runs these roles must gate them.
        - name: Find every playbook that runs the destructive storage roles
          ansible.builtin.find:
            paths:
              - "{{ playbook_dir }}/../.."
              - "{{ playbook_dir }}/../../plays"
            patterns: "*.yml"
            recurse: false
          register: _pb_files

        - name: Read those playbooks
          ansible.builtin.slurp:
            src: "{{ item.path }}"
          register: _pb_src
          loop: "{{ _pb_files.files }}"
          loop_control:
            label: "{{ item.path | basename }}"

        - name: Compute which playbooks are ungated
          ansible.builtin.set_fact:
            _ungated: >-
              {{ _ungated | default([]) +
                 ([item.item.path | basename]
                  if (('role: filesystem_setup' in (item.content | b64decode)
                       or 'role: raid_setup' in (item.content | b64decode))
                      and 'existing_mount_paths' not in (item.content | b64decode))
                  else []) }}
          loop: "{{ _pb_src.results }}"
          loop_control:
            label: "{{ item.item.path | basename }}"

        - name: 'TEST 4 ASSERT: no ungated entry point remains'
          ansible.builtin.assert:
            that:
              - _ungated | default([]) | length == 0
            fail_msg: |
              REGRESSION: {{ _ungated | join(', ') }} run(s) raid_setup or
              filesystem_setup without any reference to existing_mount_paths.
              filesystem_setup runs mkfs over mount_points — ungated, that
              reformats the array the operator asked to reuse.

        - name: Read precheck main.yml
          ansible.builtin.slurp:
            src: "{{ playbook_dir }}/../../roles/precheck/tasks/main.yml"
          register: _pc_src

        - name: 'TEST 4 ASSERT: precheck guards every hw_raid_devices reference'
          ansible.builtin.assert:
            that:
              - _unguarded | length == 0
            fail_msg: |
              REGRESSION: {{ _unguarded | length }} unguarded hw_raid_devices
              reference(s) in precheck. Tasks shared by HW-RAID and
              existing-mount mode must use `| default(...)` or an
              `is defined` test — existing-mount hosts never set that var:
              {{ _unguarded | join('\n') }}
          vars:
            # regex_findall with (?m), not .split('\n'): inside a folded YAML
            # scalar the two-character sequence backslash-n reaches Jinja
            # verbatim and does NOT split, so the whole file arrives as ONE
            # element and the audit silently passes. Character classes instead
            # of backslash escapes for the same reason.
            _hw_lines: >-
              {{ (_pc_src.content | b64decode)
                 | regex_findall('(?m)^.*hw_raid_devices.*$') }}
            _unguarded: >-
              {{ _hw_lines
                 | reject('search', 'is defined')
                 | reject('search', 'default[(]')
                 | reject('match', '[ ]*#')
                 | list }}

        - name: 'TEST 4 ASSERT: precheck distinguishes the two pre-provisioned modes'
          ansible.builtin.assert:
            that:
              - "'_precheck_existing_mounts' in (_pc_src.content | b64decode)"
            fail_msg: |
              REGRESSION: _precheck_hw_raid alone cannot say WHICH
              pre-provisioned mode is active — it is true for both. A separate
              _precheck_existing_mounts fact is required so mode-specific
              output picks the right branch.

        - name: Record TEST 4 pass
          ansible.builtin.set_fact:
            _test_passes: "{{ _test_passes + ['TEST 4: audit — opt-in default, destructive roles gated off, task file writes only mkdir'] }}"
      rescue:
        - name: Record TEST 4 failure
          ansible.builtin.set_fact:
            _test_failures: "{{ _test_failures + ['TEST 4: ' ~ (ansible_failed_result.msg | default('unknown') | replace('\n', ' '))] }}"

    # ========================================================================
    # TEST 5: check_mode on probes — pre-existing state vs state this run makes
    # ========================================================================
    # Reported 2026-08-27 on the HB120v3. A dry run of existing-mount mode
    # aborted with:
    #
    #   TASK [nvme_discovery : Fail if an export directory is not writable]
    #   failed: (item=/nvme) ... cmd: [test, -w, /nvme/tier0]  rc: 1
    #   Export directory /nvme/tier0 is not writable.
    #
    # /nvme was perfectly writable. The writability probe carried
    # `check_mode: false`, so it ran for real — but the mkdir above it was only
    # SIMULATED under --check, so it tested a directory that did not exist.
    #
    # The rule this pins: `check_mode: false` is correct for probing
    # PRE-EXISTING state (findmnt, --critical-disks, --disk-for-mount), and
    # WRONG for probing state an earlier task in the same run creates.
    - name: 'TEST 5: writability probe is not check_mode: false'
      block:
        - name: Read the task file
          ansible.builtin.slurp:
            src: "{{ playbook_dir }}/../../roles/nvme_discovery/tasks/existing_mounts.yml"
          register: _em_src

        - name: Isolate the writability probe and strip comments
          ansible.builtin.set_fact:
            _probe: >-
              {{ ((_em_src.content | b64decode).split('Verify each export directory is writable')[1]
                  | default('')).split('- name:')[0]
                 | default('') }}
            # regex_findall on the real YAML directive rather than comment
            # stripping: '\n\s+check_mode:' cannot match a commented line,
            # because a comment puts '#' between the indent and the key.
            _em_directives: >-
              {{ (_em_src.content | b64decode)
                 | regex_findall('\n\s+check_mode:\s+false') }}
            _em_raw: "{{ _em_src.content | b64decode }}"

        - name: 'TEST 5 ASSERT: the probe waits for check mode instead of overriding it'
          ansible.builtin.assert:
            that:
              - "'check_mode: false' not in _probe"
              - "'not ansible_check_mode' in _probe"
            fail_msg: |
              REGRESSION: the export-directory writability probe must NOT carry
              `check_mode: false`. The mkdir it depends on is only simulated
              under --check, so the probe would test a directory that does not
              exist and hard-fail a dry run on a perfectly good filesystem.
              Probe body: {{ _probe }}

        - name: 'TEST 5 ASSERT: only the pre-existing-state probes override check mode'
          ansible.builtin.assert:
            that:
              # findmnt mountpoint check, --critical-disks, --disk-for-mount.
              # None of those inspect anything this run creates.
              - "_em_directives | length == 3"
            fail_msg: |
              The number of `check_mode: false` directives changed. Each one
              must probe state that exists BEFORE this run. If you added a probe
              for something the play itself creates, it must be gated on
              `not ansible_check_mode` instead.
              Found {{ _em_directives | length }}, expected 3.

        - name: 'TEST 5 ASSERT: the fail task tolerates a skipped probe'
          ansible.builtin.assert:
            that:
              - "'_em_writable.results | default([])' in _em_raw"
            fail_msg: |
              REGRESSION: when the probe is skipped under --check its registered
              var has no `results` key at all, so the fail task's loop must use
              `| default([])` or the dry run dies templating the loop.

        - name: Record TEST 5 pass
          ansible.builtin.set_fact:
            _test_passes: "{{ _test_passes + ['TEST 5: writability probe defers to check mode; only pre-existing-state probes override it'] }}"
      rescue:
        - name: Record TEST 5 failure
          ansible.builtin.set_fact:
            _test_failures: "{{ _test_failures + ['TEST 5: ' ~ (ansible_failed_result.msg | default('unknown') | replace('\n', ' '))] }}"

    # ========================================================================
    # Report
    # ========================================================================
    - name: Print test report
      ansible.builtin.debug:
        msg: |
          ============================================================
          EXISTING-MOUNT MODE TEST REPORT
          ============================================================
          PASSED ({{ _test_passes | length }}):
          {% for t in _test_passes %}
            ✓ {{ t }}
          {% endfor %}

          {% if _test_failures | length > 0 %}
          FAILED ({{ _test_failures | length }}):
          {% for t in _test_failures %}
            ✗ {{ t }}
          {% endfor %}
          {% else %}
          FAILED: 0
          {% endif %}
          ============================================================

    - name: Fail the play if any test failed
      ansible.builtin.fail:
        msg: "{{ _test_failures | length }} test(s) failed."
      when: _test_failures | length > 0
