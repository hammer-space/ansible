[defaults]
# Static inventory (manual)
# inventory = inventory.yml

# Dynamic inventory options (uncomment the one you need):
# OCI only (requires: pip3 install oci):
# inventory = inventory.oci.yml
# AWS only (requires: pip3 install boto3 botocore):
# inventory = inventory.aws.yml
# GCP only (requires: pip3 install google-auth requests):
# inventory = inventory.gcp.yml

# Multi-cloud (combines all - requires all SDKs installed):
# inventory = inventory.oci.yml,inventory.aws.yml,inventory.gcp.yml

# Default: Use static inventory (no SDK required)
inventory = inventory.oci.yml
roles_path = roles
# See also UserKnownHostsFile in [ssh_connection] — this setting alone only
# adds StrictHostKeyChecking=no, which auto-accepts UNKNOWN hosts but still
# refuses a host whose key has CHANGED.
host_key_checking = False
retry_files_enabled = False
# Use built-in callback with YAML format (community.general.yaml was removed in v12)
stdout_callback = default
callback_result_format = yaml
interpreter_python = auto_silent
deprecation_warnings = False

# NOTE: do NOT hardcode a private key path here. This used to be pinned to
# /home/ubuntu/.ssh/ansible_admin_key, which exists only on one OCI box; on any
# other controller (e.g. a CycleCloud scheduler running as cycleadmin out of
# /shared/home/cycleadmin) ssh reported
#     no such identity: /home/ubuntu/.ssh/ansible_admin_key
# and fell through to "Permission denied (publickey)".
#
# Supply the key per-environment instead, in preference order:
#   1. ~/.ssh/config      IdentityFile per Host / per subnet  (recommended)
#   2. ssh-agent          ssh-add /path/to/key
#   3. env var            export ANSIBLE_PRIVATE_KEY_FILE=/path/to/key
#   4. CLI                ansible-playbook --private-key /path/to/key
#   5. inventory          ansible_ssh_private_key_file on the host/group
# private_key_file = /path/to/your/key

[privilege_escalation]
become = True
become_method = sudo
become_user = root

[ssh_connection]
pipelining = True
# UserKnownHostsFile=/dev/null is required IN ADDITION to host_key_checking:
# StrictHostKeyChecking=no accepts hosts it has never seen, but a CHANGED key
# is still a hard failure ("REMOTE HOST IDENTIFICATION HAS CHANGED"). Azure
# VMSS / CycleCloud recycle instances constantly and reuse their private IPs,
# so a stale known_hosts entry for a reimaged node is the normal state, not an
# attack. Discarding the known_hosts file makes that non-fatal.
#
# TRADEOFF: this disables SSH man-in-the-middle protection for every host this
# repo talks to. It is appropriate for ephemeral nodes on a private VNet. If you
# manage long-lived hosts across an untrusted network, drop the two host-key
# options below and prune stale entries with `ssh-keygen -R <ip>` instead.
#
# LogLevel=ERROR suppresses the per-host "Permanently added ... to the list of
# known hosts" warning that /dev/null would otherwise emit on every connection.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null -o LogLevel=ERROR
