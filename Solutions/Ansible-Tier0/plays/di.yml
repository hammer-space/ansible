---
# Data Instantiator (DI / NFS Mover) Deployment.
# Imported by site.yml.
#
# Optional: deploy Hammerspace DI on dedicated mover nodes.
# Enable with deploy_di: true in vars/main.yml or -e deploy_di=true
#
# DI nodes are separate from storage_servers — define them in the di_nodes
# inventory group. They can overlap with storage_servers if DI runs on the
# same hosts.
#
# Three deployment modes:
#   di_deployment_type: "host"       - Install pd-di RPM directly on the OS
#   di_deployment_type: "container"  - Build & run pd-di in a container (podman/docker)
#   di_deployment_type: "kubernetes" - Build/push image + apply DaemonSet to k8s
#                                      cluster (containerd CRI)
#
# Usage:
#   ansible-playbook site.yml -i inventory.yml -e deploy_di=true
#   ansible-playbook site.yml -i inventory.yml --tags di
#   ansible-playbook site.yml -i inventory.yml --tags di --limit "mover101"
#   ansible-playbook site.yml -i inventory.yml --tags di-k8s-status   # refresh status labels

# ===========================================================================
# K8s build play. Runs first, ONLY when k8s mode is selected AND a build host
# is present in inventory. No-op for host/container modes (end_play early).
# ===========================================================================

- name: Build and push DI image for Kubernetes
  hosts: di_k8s_build_hosts
  become: true
  gather_facts: true

  vars_files:
    - ../vars/main.yml

  pre_tasks:
    - name: Load vault variables (if available)
      ansible.builtin.include_vars:
        file: "{{ repo_root }}/vars/vault.yml"
      failed_when: false
      no_log: true
      tags: [always]

    # Azure Key Vault (opt-in) — overrides vars/vault.yml when set. Must
    # resolve BEFORE anything authenticates against the Anvil.
    # The always-tag below is required: pre_tasks here must survive
    # `--tags di-activate` filtering (test_di_activate_tag.yml enforces this).
    - name: Retrieve Hammerspace password from Azure Key Vault (optional)
      ansible.builtin.include_role:
        name: hammerspace_integration
        tasks_from: keyvault_password
      when: (hammerspace_keyvault_uri | default('')) | length > 0
      tags: [always]

    - name: Skip build play unless k8s mode + build_push is enabled
      ansible.builtin.meta: end_play
      when:
        - (not (deploy_di | default(false) | bool))
          or (di_deployment_type | default('host') != 'kubernetes')
          or (not (di_k8s_build_push | default(true) | bool))
      tags: [always]

    - name: Auto-install kubernetes.core (controller)
      ansible.builtin.command:
        cmd: ansible-galaxy collection install -r {{ repo_root }}/requirements.yml kubernetes.core
      delegate_to: localhost
      become: false
      run_once: true
      when: di_k8s_auto_install_collection | default(true) | bool
      changed_when: false
      failed_when: false
      tags: [always]

  tasks:
    - name: Build and push DI image
      ansible.builtin.include_tasks:
        file: "{{ repo_root }}/roles/di/tasks/kubernetes_image_build.yml"
        apply:
          tags: [di, di-k8s, di-k8s-build]
      tags: [di, di-k8s, di-k8s-build]

# ===========================================================================
# Main DI deployment play (all three modes).
# ===========================================================================

- name: Deploy Hammerspace Data Instantiator (DI)
  hosts: di_nodes
  become: true
  gather_facts: true

  vars_files:
    - ../vars/main.yml

  # All pre_tasks carry `tags: [always]` so they run under any --tags filter
  # (notably --tags di-activate). Without this, vault load + validation +
  # node-exists check get skipped, and the activation run can't find the
  # password or determine whether the node is already registered.
  pre_tasks:
    # vars/main.yml defines repo_root = "{{ playbook_dir }}/..", which handles
    # the plays/-subdirectory resolution. See vars/main.yml header for context.
    - name: Load vault variables (if available)
      ansible.builtin.include_vars:
        file: "{{ repo_root }}/vars/vault.yml"
      failed_when: false
      no_log: true
      tags: [always]

    - name: Require hammerspace_api_host (set with -e hammerspace_api_host=<anvil-ip>)
      ansible.builtin.include_role:
        name: hammerspace_integration
        tasks_from: require_api_host
      tags: [always]

    # Azure Key Vault (opt-in) — overrides vars/vault.yml when set. Must
    # resolve BEFORE anything authenticates against the Anvil.
    # The always-tag below is required: pre_tasks here must survive
    # `--tags di-activate` filtering (test_di_activate_tag.yml enforces this).
    - name: Retrieve Hammerspace password from Azure Key Vault (optional)
      ansible.builtin.include_role:
        name: hammerspace_integration
        tasks_from: keyvault_password
      when: (hammerspace_keyvault_uri | default('')) | length > 0
      tags: [always]

    - name: Skip DI deployment if not enabled
      ansible.builtin.meta: end_play
      when: not (deploy_di | default(false) | bool)
      tags: [always]

    - name: Verify required DI variables are defined
      ansible.builtin.assert:
        that:
          - hammerspace_cluster_mgmt_ip is defined
          - hammerspace_api_user is defined
          - hammerspace_api_password is defined
        fail_msg: "Required Hammerspace cluster variables are not defined. Check vars/main.yml"
      tags: [always]

    - name: Validate di_deployment_type
      ansible.builtin.assert:
        that:
          - di_deployment_type in ['host', 'container', 'kubernetes']
        fail_msg: "di_deployment_type must be 'host', 'container', or 'kubernetes' (got: '{{ di_deployment_type }}')"
      tags: [always]

    - name: Display selected DI deployment mode
      ansible.builtin.debug:
        msg: >-
          DI deployment mode: {{ di_deployment_type }}{% if di_deployment_type == 'container' %}
          ({{ di_container_runtime }}, image={{ di_container_image }},
          base={{ di_container_base_image }}){% elif di_deployment_type == 'kubernetes' %}
          (namespace={{ di_k8s_namespace }},
          image={{ di_k8s_registry }}/{{ di_k8s_registry_namespace }}/{{ di_k8s_image_repository }}:{{ di_k8s_image_tag }},
          selector={{ di_k8s_node_selector_label }}={{ di_k8s_node_selector_value }}){% endif %}
      tags: [always]

    - name: Check if DI node already exists in Hammerspace
      ansible.builtin.shell:
        cmd: >-
          curl -s -o /dev/stdout -w "\n%{http_code}" --max-time 30
          {{ '' if (hammerspace_api_validate_certs | default(false)) else '-k' }}
          -H "Authorization: Basic {{ (hammerspace_api_user ~ ':' ~ hammerspace_api_password) | b64encode }}"
          "https://{{ hammerspace_api_host }}:{{ hammerspace_api_port | default(8443) }}/mgmt/v1.2/rest/nodes/{{ di_node_name | default(inventory_hostname) | urlencode }}"
      register: hs_di_precheck_raw
      changed_when: false
      failed_when: false
      check_mode: false
      tags: [always]

    - name: Set DI node_already_registered fact
      ansible.builtin.set_fact:
        node_already_registered: "{{ ((hs_di_precheck_raw.stdout_lines | default(['404']))[-1] | int) == 200 }}"
      tags: [always]

    - name: Display DI node registration status
      ansible.builtin.debug:
        msg: >-
          DI node '{{ di_node_name | default(inventory_hostname) }}'
          {{ 'is already registered in Hammerspace' if node_already_registered | bool
          else 'is not yet registered in Hammerspace' }}
      tags: [always]

  roles:
    - role: di
      tags: [di]

  # post_tasks also tagged [always] so the deployment-complete summary prints
  # regardless of which --tags filter the user invoked.
  post_tasks:
    - name: DI deployment complete (host mode)
      ansible.builtin.debug:
        msg: |
          ============================================
          DI DEPLOYMENT COMPLETE
          ============================================
          Node: {{ di_node_name | default(inventory_hostname) }}
          Mode: host (native RPM)
          Verify: ssh {{ inventory_hostname }} "systemctl status pd-di"
          Cluster: anvil> node-list --name {{ di_node_name | default(inventory_hostname) }}
          ============================================
      when: di_deployment_type == 'host'
      tags: [always]

    - name: DI deployment complete (container mode)
      ansible.builtin.debug:
        msg: |
          ============================================
          DI DEPLOYMENT COMPLETE
          ============================================
          Node: {{ di_node_name | default(inventory_hostname) }}
          Mode: container ({{ di_container_runtime }})
          Container: {{ di_container_name }}
          Image: {{ di_container_image }}
          Verify: ssh {{ inventory_hostname }} "{{ di_container_runtime }} exec {{ di_container_name }} systemctl status pd-di"
          Logs:   ssh {{ inventory_hostname }} "{{ di_container_runtime }} logs {{ di_container_name }}"
          Cluster: anvil> node-list --name {{ di_node_name | default(inventory_hostname) }}
          ============================================
      when: di_deployment_type == 'container'
      tags: [always]

    - name: DI deployment complete (kubernetes mode)
      ansible.builtin.debug:
        msg: |
          ============================================
          DI DEPLOYMENT COMPLETE (Kubernetes)
          ============================================
          Namespace: {{ di_k8s_namespace }}
          DaemonSet: hammerspace-di
          Image:     {{ di_k8s_registry }}/{{ di_k8s_registry_namespace }}/{{ di_k8s_image_repository }}:{{ di_k8s_image_tag }}
          Selector:  {{ di_k8s_node_selector_label }}={{ di_k8s_node_selector_value }}
          Status label: {{ di_k8s_status_label }} (ready|degraded|failed)

          Verify pods:
            kubectl -n {{ di_k8s_namespace }} get pods -o wide
          Verify pd-di (logs alone won't show pd-di; image runs systemd):
            kubectl -n {{ di_k8s_namespace }} exec ds/hammerspace-di -- journalctl -u pd-di -n 50
          Inspect node labels:
            kubectl get nodes -L {{ di_k8s_node_selector_label }},{{ di_k8s_status_label }}
          Refresh status labels (no full re-deploy):
            ansible-playbook plays/di.yml -e deploy_di=true --tags di-k8s-status
          ============================================
      run_once: true
      delegate_to: localhost
      when: di_deployment_type == 'kubernetes'
      tags: [always]
