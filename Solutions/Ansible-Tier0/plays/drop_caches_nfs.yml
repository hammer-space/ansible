---
# Flush page cache, compact memory, and bounce the NFS server on OCI instances.
# Run against a host group (default: storage_servers). Override with -e target_hosts=...

- name: Drop caches, compact memory, restart NFS on OCI instances
  hosts: "{{ target_hosts | default('storage_servers') }}"
  become: true
  gather_facts: false

  tasks:
    - name: Flush filesystem buffers and drop page/inode/dentry caches
      ansible.builtin.shell: |
        set -euo pipefail
        sync
        echo 3 > /proc/sys/vm/drop_caches
        echo 1 > /proc/sys/vm/compact_memory
      args:
        executable: /bin/bash
      changed_when: true

    - name: Restart nfs-kernel-server
      ansible.builtin.systemd:
        name: nfs-kernel-server
        state: restarted

    - name: Get nfs-kernel-server status
      ansible.builtin.command: systemctl status nfs-kernel-server
      register: nfs_status
      changed_when: false
      failed_when: false

    - name: Show nfs-kernel-server status
      ansible.builtin.debug:
        var: nfs_status.stdout_lines
