---
# Kubernetes-mode decommission.
# Order: clear status + deployment labels on target nodes -> delete DaemonSet
# -> delegate API deregistration to the existing decommission.yml block.

- name: Compute target nodes
  ansible.builtin.set_fact:
    _di_k8s_target_nodes: >-
      {{ di_k8s_target_nodes
         if (di_k8s_target_nodes | length > 0)
         else (groups['di_nodes'] | default([])
               | map('extract', hostvars, 'inventory_hostname') | list) }}
  delegate_to: localhost
  become: false
  run_once: true

- name: Remove status label from target nodes
  ansible.builtin.command:
    cmd: >-
      kubectl --kubeconfig {{ di_k8s_kubeconfig }} label node {{ item }}
      {{ di_k8s_status_label }}-
  loop: "{{ _di_k8s_target_nodes }}"
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: true
  failed_when: false

- name: Remove deployment label from target nodes (evicts pods)
  ansible.builtin.command:
    cmd: >-
      kubectl --kubeconfig {{ di_k8s_kubeconfig }} label node {{ item }}
      {{ di_k8s_node_selector_label }}-
  loop: "{{ _di_k8s_target_nodes }}"
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: true
  failed_when: false

- name: Delete DaemonSet
  ansible.builtin.command:
    cmd: >-
      kubectl --kubeconfig {{ di_k8s_kubeconfig }} -n {{ di_k8s_namespace }}
      delete daemonset hammerspace-di --ignore-not-found
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: true

- name: Delete API credentials Secret
  ansible.builtin.command:
    cmd: >-
      kubectl --kubeconfig {{ di_k8s_kubeconfig }} -n {{ di_k8s_namespace }}
      delete secret {{ di_k8s_api_credentials_secret }} --ignore-not-found
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: true

- name: Delete image pull Secret
  ansible.builtin.command:
    cmd: >-
      kubectl --kubeconfig {{ di_k8s_kubeconfig }} -n {{ di_k8s_namespace }}
      delete secret {{ di_k8s_image_pull_secret }} --ignore-not-found
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: true
  when: di_k8s_image_pull_secret | length > 0

- name: Delete namespace (when di_k8s_decommission_delete_namespace)
  ansible.builtin.command:
    cmd: >-
      kubectl --kubeconfig {{ di_k8s_kubeconfig }}
      delete namespace {{ di_k8s_namespace }} --ignore-not-found
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: true
  when: di_k8s_decommission_delete_namespace | default(false) | bool
