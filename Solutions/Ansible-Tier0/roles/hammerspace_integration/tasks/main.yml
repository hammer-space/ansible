---
# Hammerspace Integration Role - Register node, volumes, and shares via API
# Extended with engineering team features
# Based on https://github.com/hammer-space/ansible

- name: Validate Hammerspace API configuration
  ansible.builtin.assert:
    that:
      - hammerspace_api_host is defined
      - hammerspace_api_user is defined
      - hammerspace_api_password is defined
    fail_msg: "Hammerspace API configuration missing. Set hammerspace_api_host, hammerspace_api_user, hammerspace_api_password"

- name: Set API base URL
  ansible.builtin.set_fact:
    hs_api_url: "https://{{ hammerspace_api_host }}:{{ hammerspace_api_port | default(8443) }}/mgmt/v1.2/rest"

# =============================================================================
# API Method Detection (curl vs uri module)
# =============================================================================
# Python 3.13 removed cert_file/key_file from HTTPSConnection.__init__(),
# breaking ansible.builtin.uri. Auto-detect selects the best method.

- name: Detect API method
  ansible.builtin.set_fact:
    _hs_use_curl: >-
      {{ true if (hammerspace_api_method | default('auto')) == 'curl'
         else false if (hammerspace_api_method | default('auto')) == 'uri'
         else (ansible_python_version is version('3.13', '>=')) }}

- name: Display API method
  ansible.builtin.debug:
    msg: >-
      API method: {{ 'curl' if _hs_use_curl else 'uri' }}
      (Python {{ ansible_python_version }}, config: {{ hammerspace_api_method | default('auto') }})
  when: hammerspace_debug | default(false)

# =============================================================================
# Cluster Configuration (Optional - run first)
# =============================================================================

- name: Update DNS configuration
  ansible.builtin.include_tasks: cluster/dns_update.yml
  vars:
    dns_config: "{{ hammerspace_dns_config }}"
  when:
    - hammerspace_update_dns | default(false)
    - hammerspace_dns_config is defined

- name: Join Active Directory
  ansible.builtin.include_tasks: cluster/ad_join.yml
  vars:
    ad_config: "{{ hammerspace_ad_config }}"
  when:
    - hammerspace_join_ad | default(false)
    - hammerspace_ad_config is defined

- name: Update site name
  ansible.builtin.include_tasks: cluster/change_site_name.yml
  vars:
    site_config: "{{ hammerspace_site_config }}"
  when:
    - hammerspace_update_site_name | default(false)
    - hammerspace_site_config is defined

- name: Set cluster location
  ansible.builtin.include_tasks: cluster/set_location.yml
  vars:
    location_config: "{{ hammerspace_location_config }}"
  when:
    - hammerspace_set_location | default(false)
    - hammerspace_location_config is defined

- name: Enable Prometheus exporters
  ansible.builtin.include_tasks: cluster/prometheus_enable.yml
  vars:
    prometheus_config: "{{ hammerspace_prometheus_config | default({}) }}"
  when: hammerspace_enable_prometheus | default(false)

# =============================================================================
# S3/Object Storage Integration (Optional)
# =============================================================================

- name: Add S3 storage nodes
  ansible.builtin.include_tasks: s3/add_s3_node.yml
  loop: "{{ hammerspace_s3_nodes | default([]) }}"
  loop_control:
    loop_var: s3_node_config
    label: "{{ s3_node_config.name }}"
  when:
    - hammerspace_add_s3_nodes | default(false)
    - hammerspace_s3_nodes is defined
    - hammerspace_s3_nodes | length > 0

- name: Add object storage volumes
  ansible.builtin.include_tasks: s3/add_object_storage_volume.yml
  loop: "{{ hammerspace_object_volumes | default([]) }}"
  loop_control:
    loop_var: object_volume_config
    label: "{{ object_volume_config.name | default(object_volume_config.bucket_name) }}"
  when:
    - hammerspace_add_object_volumes | default(false)
    - hammerspace_object_volumes is defined
    - hammerspace_object_volumes | length > 0

- name: Create S3 server
  ansible.builtin.include_tasks: s3/create_s3_server.yml
  vars:
    s3_server_config: "{{ hammerspace_s3_server }}"
  when:
    - hammerspace_create_s3_server | default(false)
    - hammerspace_s3_server is defined

- name: Create S3 users
  ansible.builtin.include_tasks: s3/create_s3_user.yml
  loop: "{{ hammerspace_s3_users | default([]) }}"
  loop_control:
    loop_var: s3_user_config
    label: "{{ s3_user_config.name }}"
  when:
    - hammerspace_create_s3_users | default(false)
    - hammerspace_s3_users is defined
    - hammerspace_s3_users | length > 0

# =============================================================================
# Add Storage System (Node)
# =============================================================================

- name: Set node name and IP
  ansible.builtin.set_fact:
    hs_node_name: "{{ hammerspace_node_name | default(inventory_hostname) }}"
    hs_node_ip: "{{ hammerspace_node_ip | default(ansible_default_ipv4.address) }}"

# The node AND its volumes are registered on this one address. On a GPU node
# with a separate storage / RDMA network, the default-route NIC is usually the
# management one — so every remote reader (DSX mover, other Tier 0 nodes)
# reaches the volume over the management network, and the Tier 0 guide's
# "IP per NIC" recommendation is unmet. Nothing here can pick the right NIC;
# it can only make the choice visible.
- name: Warn when the registration IP was auto-picked on a multi-NIC host
  ansible.builtin.debug:
    msg: >-
      WARNING: {{ inventory_hostname }} has {{ ansible_all_ipv4_addresses | length }}
      IPv4 addresses ({{ ansible_all_ipv4_addresses | join(', ') }}) and
      hammerspace_node_ip is not set, so the node and its volumes will be
      registered on the default-route address {{ hs_node_ip }}. If the data
      path is on another NIC, set hammerspace_node_ip (and
      hammerspace_additional_ips for the rest) or the DSX and other clients
      will reach this node's volumes over the wrong network.
  when:
    - hammerspace_node_ip is not defined
    - (ansible_all_ipv4_addresses | default([])) | length > 1

# =============================================================================
# Azure AZ Detection (Optional - must precede AZ mapping, which consumes
# the azure_zone / azure_fault_domain facts this sets)
# =============================================================================

- name: Detect AZ from Azure Instance Metadata Service
  ansible.builtin.include_tasks: azure_imds_az.yml
  when: hammerspace_azure_imds_az | default(false)
  tags: [hammerspace, azure-imds-az]

# =============================================================================
# AZ Mapping (Optional - before node registration)
# =============================================================================

- name: Configure AZ mapping
  ansible.builtin.include_tasks: az_map.yml
  when: hammerspace_enable_az_mapping | default(false)

# =============================================================================
# GPU Fabric AZ Detection (Optional - auto-detect AZ from GPU memory fabric)
# =============================================================================

- name: Detect AZ from GPU memory fabric
  ansible.builtin.include_tasks: gpu_fabric_az.yml
  when: hammerspace_gpu_fabric_az | default(false)
  tags: [hammerspace, gpu-fabric-az]

# =============================================================================
# Node Registration
# =============================================================================

- name: Build storage system payload
  ansible.builtin.set_fact:
    storage_system_payload:
      name: "{{ hs_node_name }}"
      nodeType: "OTHER"
      mgmtIpAddress:
        address: "{{ hs_node_ip }}"
      _type: "NODE"

- name: Check if storage system already exists
  ansible.builtin.shell:
    cmd: >-
      curl -s -w "\n%{http_code}" --max-time 60
      {{ '' if (hammerspace_api_validate_certs | default(false)) else '-k' }}
      -H "Authorization: Basic {{ (hammerspace_api_user ~ ':' ~ hammerspace_api_password) | b64encode }}"
      "{{ hs_api_url }}/nodes/{{ hs_node_name | urlencode }}"
  register: node_check_raw
  changed_when: false
  failed_when: false
  check_mode: false

- name: Parse node check result
  ansible.builtin.set_fact:
    node_check:
      status: "{{ (node_check_raw.stdout_lines | default(['0']))[-1] | default('0') | int }}"
      json: "{{ ((node_check_raw.stdout_lines | default(['{}']))[:-1] | join('\n') | trim | default('{}', true)) | from_json }}"

- name: Add storage system to Hammerspace cluster
  ansible.builtin.shell:
    cmd: >-
      curl -s -w "\n%{http_code}" --max-time {{ hammerspace_api_curl_timeout | default(180) }}
      {{ '' if (hammerspace_api_validate_certs | default(false)) else '-k' }}
      -H "Authorization: Basic {{ (hammerspace_api_user ~ ':' ~ hammerspace_api_password) | b64encode }}"
      -X POST -H "Content-Type: application/json"
      -D /tmp/hs_node_add_headers.txt
      -d '{{ storage_system_payload | to_json }}'
      "{{ hs_api_url }}/nodes?ip={{ hs_node_ip }}"
  register: node_add_raw
  changed_when: true
  when:
    - not ansible_check_mode
    - node_check.status | int == 404

- name: Extract location header from node add response
  ansible.builtin.shell: |
    grep -i '^Location:' /tmp/hs_node_add_headers.txt 2>/dev/null | awk '{print $2}' | tr -d '\r\n'
  register: node_add_location_raw
  changed_when: false
  when:
    - not ansible_check_mode
    - node_check.status | int == 404

- name: Parse node add result
  ansible.builtin.set_fact:
    node_add_result:
      status: "{{ (node_add_raw.stdout_lines | default(['0']))[-1] | default('0') | int }}"
      location: "{{ node_add_location_raw.stdout | default('') }}"
  when:
    - not ansible_check_mode
    - node_check.status | int == 404

- name: Wait for storage system add to complete
  ansible.builtin.shell:
    cmd: >-
      curl -s --max-time {{ hammerspace_api_curl_timeout | default(60) }}
      {{ '' if (hammerspace_api_validate_certs | default(false)) else '-k' }}
      -H "Authorization: Basic {{ (hammerspace_api_user ~ ':' ~ hammerspace_api_password) | b64encode }}"
      "{{ node_add_result.location }}"
  register: node_add_status_raw
  changed_when: false
  until: (node_add_status_raw.stdout | default('{}') | from_json).status | default('') in ["COMPLETED", "FAILED", "CANCELLED"]
  retries: "{{ hammerspace_node_add_retries | default(30) }}"
  delay: "{{ hammerspace_node_add_delay | default(10) }}"
  when:
    - not ansible_check_mode
    - node_add_result is defined
    - node_add_result.location | default('') | length > 0

- name: Fail if node add task did not complete successfully
  ansible.builtin.fail:
    msg: >-
      Node add task ended with status: {{ (node_add_status_raw.stdout | default('{}') | from_json).status | default('UNKNOWN') }}.
      Check Hammerspace GUI for details.
  when:
    - not ansible_check_mode
    - node_add_status_raw is defined
    - node_add_status_raw.stdout is defined
    - (node_add_status_raw.stdout | default('{}') | from_json).status | default('') in ["FAILED", "CANCELLED"]

- name: Display storage system status
  ansible.builtin.debug:
    msg: >-
      Storage system '{{ hs_node_name }}' ({{ hs_node_ip }})
      {% if node_check.status | int == 200 %}already exists{% else %}added successfully{% endif %}

# =============================================================================
# Volume Groups (Optional - before volumes)
# =============================================================================

# run_once: the list is cluster-wide, and a per-host include had every host
# GET (404), then POST the same group. `| bool`: `-e
# hammerspace_create_volume_groups=false` passes the STRING "false", which is
# truthy without it.
- name: Create volume groups
  ansible.builtin.include_tasks: volume_group_create.yml
  loop: "{{ hammerspace_volume_groups | default([]) }}"
  loop_control:
    loop_var: volume_group_config
    label: "{{ volume_group_config.name }}"
  run_once: true
  when:
    - hammerspace_create_volume_groups | default(false) | bool
    - hammerspace_volume_groups is defined
    - hammerspace_volume_groups | length > 0

# =============================================================================
# Add Storage Volumes
# =============================================================================

- name: Add storage volumes to Hammerspace
  ansible.builtin.include_tasks: add_volume.yml
  loop: "{{ mount_points }}"
  loop_control:
    loop_var: volume_config
    label: "{{ volume_config.path }}"
  when: hammerspace_add_volumes | default(true)

# =============================================================================
# Add Volumes to Volume Groups (after volumes are added)
# =============================================================================

# Append this run's volumes to a volume group that already exists. Runs once
# for the whole play (single read-modify-write) — see the task file for why a
# per-host update races and silently drops volumes.
# Gated on ANY host naming a group, not on this host's value. The value may be
# set per host or per inventory group, and the join itself is run_once — so a
# gate that reads only the current host's value skips the whole step whenever
# the host Ansible picks happens not to name one.
- name: Add this run's volumes to an existing volume group
  ansible.builtin.include_tasks: volume_group_join.yml
  when: >-
    ((hammerspace_volume_group | default('')) | trim | length > 0)
    or ((ansible_play_hosts
         | map('extract', hostvars, 'hammerspace_volume_group')
         | select('defined') | map('string') | map('trim')
         | reject('equalto', '') | list | length) > 0)

- name: Add volumes to existing volume groups
  ansible.builtin.include_tasks: volume_group_add_volume.yml
  loop: "{{ hammerspace_volume_group_members | default([]) }}"
  loop_control:
    loop_var: volume_group_update
    label: "{{ volume_group_update.volume_name }} -> {{ volume_group_update.group_name }}"
  when:
    - hammerspace_volume_group_members is defined
    - hammerspace_volume_group_members | length > 0

# =============================================================================
# Create Shares (Optional)
# =============================================================================

- name: Create Hammerspace shares
  ansible.builtin.include_tasks: create_share.yml
  loop: "{{ hammerspace_shares | default([]) }}"
  loop_control:
    loop_var: share_config
    label: "{{ share_config.name }}"
  when:
    - hammerspace_create_shares | default(false)
    - hammerspace_shares is defined
    - hammerspace_shares | length > 0

# =============================================================================
# Apply Share Objectives (Optional - after shares)
# =============================================================================

- name: Apply share objectives
  ansible.builtin.include_tasks: share_apply_objective.yml
  loop: "{{ hammerspace_share_objectives | default([]) }}"
  loop_control:
    loop_var: share_objective_config
    label: "{{ share_objective_config.share_name }}"
  when:
    - hammerspace_apply_share_objectives | default(false)
    - hammerspace_share_objectives is defined
    - hammerspace_share_objectives | length > 0

# =============================================================================
# Tier 0 placement: apply the volume group's place-on objective to the shares
# (Optional - after shares). Without it the default objectives spread new
# files across every volume, DSX-backed ones included.
# =============================================================================

- name: Apply the volume group place-on objective to the Tier 0 shares
  ansible.builtin.include_tasks: tier0_place_on_group.yml
  when: hammerspace_tier0_place_on_group | default(false) | bool

# =============================================================================
# Summary
# =============================================================================

- name: Display Hammerspace integration summary
  ansible.builtin.debug:
    msg: |
      ============================================
      HAMMERSPACE INTEGRATION COMPLETE
      ============================================
      Anvil API: {{ hammerspace_api_host }}
      Storage System: {{ hs_node_name }}
      Node IP: {{ hs_node_ip }}
      Volumes Added: {{ mount_points | length }}

      Features Enabled:
        - Task Queue Throttling: {{ hammerspace_task_queue_throttle | default(true) }}
        - AZ Mapping: {{ hammerspace_enable_az_mapping | default(false) }}
        - Volume Groups: {{ hammerspace_create_volume_groups | default(false) | bool }}
        - Share Objectives: {{ hammerspace_apply_share_objectives | default(false) }}
        - S3 Nodes: {{ hammerspace_add_s3_nodes | default(false) }}
        - Prometheus: {{ hammerspace_enable_prometheus | default(false) }}

      Verify in Hammerspace GUI or CLI:
        anvil> node-list
        anvil> volume-list
        anvil> share-list
      ============================================
