---
# Fetch the Hammerspace admin password from Azure Key Vault (OPT-IN).
#
# Alternative to vars/vault.yml for sites that already manage secrets in Key
# Vault and do not want a password file on the scheduler at all.
#
# Inert unless hammerspace_keyvault_uri is set. When it is, the retrieved
# secret OVERRIDES hammerspace_api_password for the rest of the run.
#
# WHY IT RUNS AS A pre_task
# -------------------------
# plays/storage.yml authenticates against the Anvil in pre_tasks, long before
# hammerspace_integration executes. The password therefore has to be resolved
# before that preflight, which is why this file is included via include_role +
# tasks_from from each play's pre_tasks rather than from the role's main.yml.
#
# AUTHENTICATION
# --------------
# Uses the standard azure.azcollection auth chain. On a CycleCloud scheduler
# with a managed identity assigned, hammerspace_keyvault_auth_source: msi is
# the usual choice; `auto` also works but tries several sources first.
#
# The identity needs GET on secrets for the vault — either the "Key Vault
# Secrets User" RBAC role, or a `get` secret permission in the vault's access
# policy if it still uses the legacy model.
#
# no_log is set on every task that can see the secret. Do NOT remove it: the
# lookup result contains the plaintext password and would otherwise be printed
# by -v and written to the log file that scripts/run.sh configures.

- name: Verify the Key Vault secret name is set
  ansible.builtin.fail:
    msg: |
      hammerspace_keyvault_uri is set but hammerspace_keyvault_secret_name is
      not. Both are required to retrieve the password from Key Vault.

        hammerspace_keyvault_uri:         "{{ hammerspace_keyvault_uri }}"
        hammerspace_keyvault_secret_name: <unset>

      Set the secret name, or unset hammerspace_keyvault_uri to fall back to
      vars/vault.yml.
  when: (hammerspace_keyvault_secret_name | default('')) | length == 0

# A trailing slash on the vault URI is the single easiest thing to get wrong
# (it is how the portal displays it), so it is stripped rather than diagnosed.
# The bare vault NAME is derived here too, so the `az` commands in the failure
# messages below are copy-pasteable instead of carrying a <vault> placeholder.
- name: Normalize the Key Vault URI
  ansible.builtin.set_fact:
    _hs_kv_uri: "{{ hammerspace_keyvault_uri | regex_replace('/+$', '') }}"
    _hs_kv_vault_name: >-
      {{ hammerspace_keyvault_uri
         | regex_replace('^https?://', '')
         | regex_replace('/.*$', '')
         | regex_replace('\..*$', '') }}

- name: Retrieve the Hammerspace admin password from Azure Key Vault
  azure.azcollection.azure_rm_keyvaultsecret_info:
    vault_uri: "{{ _hs_kv_uri }}"
    name: "{{ hammerspace_keyvault_secret_name }}"
    auth_source: "{{ hammerspace_keyvault_auth_source | default('auto') }}"
  register: _hs_kv_secret
  delegate_to: localhost
  run_once: true
  become: false
  changed_when: false
  # Read-only lookup of pre-existing state, so it must still run under --check
  # or a dry run would proceed with an empty password and fail the API
  # preflight for a reason that has nothing to do with the dry run.
  check_mode: false
  no_log: true
  # 2026-09-03: `no_log` censors the WHOLE result, including the failure
  # message. When auth or RBAC was wrong this task aborted the play with
  # nothing but "the output has been hidden due to the fact that ''no_log:
  # true'' was specified for this result" — an undiagnosable log, the same
  # class of dead end as the 2026-08-26 blank diagnostics block.
  #
  # So the module is never allowed to fail the play itself. The next task
  # reports the error explicitly. `no_log` still applies here, which is what
  # keeps the SUCCESS result (it carries the plaintext secret) out of the log.
  failed_when: false

# Surfaces the Azure error that `no_log` above censors. Safe to print: this
# runs only on the failure path, where the module returned no secret at all,
# and the message is the SDK exception. The module's own arguments hold no
# credentials either (vault URI, secret name, auth source).
- name: Fail with the real Key Vault error if the lookup did not succeed
  ansible.builtin.fail:
    msg: |
      Azure Key Vault lookup FAILED for secret '{{ hammerspace_keyvault_secret_name }}'
      at {{ hammerspace_keyvault_uri }}.

      Azure reported:
        {{ (_hs_kv_secret.msg | default('(no message returned)')) | replace('\n', '\n  ') }}

      The four causes, in the order they actually occur:

        1. AUTHENTICATION. hammerspace_keyvault_auth_source is
           '{{ hammerspace_keyvault_auth_source | default('auto') }}'.
           On a CycleCloud scheduler with an assigned managed identity this
           must be 'msi'. Use 'cli' only when running under `az login`.
           Confirm an identity is actually attached:
             curl -sS -H Metadata:true --max-time 5 \
               'http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://vault.azure.net'

        2. AUTHORIZATION. The identity needs GET on secrets for this vault —
           the "Key Vault Secrets User" role, or a `get` secret permission if
           the vault still uses access policies. A 403 here means auth worked
           and the role assignment is what is missing.

        3. VAULT URI. Must be the full form, https://<name>.vault.azure.net,
           with no trailing slash and no /secrets path.

        4. NETWORK. A vault behind a private endpoint or firewall must be
           reachable from the scheduler, which is where this lookup runs.

      Reproduce outside Ansible — this is the fastest way to separate 1 from 2:
        az keyvault secret show --vault-name {{ _hs_kv_vault_name }} --name {{ hammerspace_keyvault_secret_name }} --query value -o tsv
  when: _hs_kv_secret.failed | default(false)

# The module returns `secrets` as a LIST; a missing secret yields an empty list
# rather than an error, so this is checked explicitly instead of indexing blind.
#
# WHAT AN EMPTY LIST DOES AND DOES NOT MEAN
# -----------------------------------------
# azure_rm_keyvaultsecret_info.get_secret() swallows ONLY ResourceNotFoundError
# into an empty result; every other exception goes through self.fail(). So
# reaching this task proves a real HTTP 404 — the credential authenticated AND
# was authorized, because a permissions problem returns 403, raises
# HttpResponseError, and fails the task above instead.
#
# That is a useful narrowing, so the message says it. The old wording listed
# "the identity has GET on secrets" as a candidate cause, which sent operators
# to re-check an RBAC assignment that was already proven working, and pointed
# at `az keyvault secret show` — the one command guaranteed to reproduce the
# same 404 without adding information. List the vault instead.
- name: Fail if the Key Vault secret was not found
  ansible.builtin.fail:
    msg: |
      Key Vault returned NO secret named '{{ hammerspace_keyvault_secret_name }}'
      at {{ _hs_kv_uri }} (HTTP 404).

      Authentication and permissions are NOT the problem. A credential or RBAC
      failure returns 403 and fails the retrieval task before this one; getting
      here means the vault answered and reported no such secret. So the secret
      name or the vault is wrong.

      List what the vault actually holds — this is the command that resolves it:
        az keyvault secret list --vault-name {{ _hs_kv_vault_name }} --query "[].name" -o tsv

      Then check, in this order:
        - NAME CASE. Key Vault secret names are case-sensitive.
          '{{ hammerspace_keyvault_secret_name }}' must match a listed name exactly.
        - WRONG VAULT. '{{ _hs_kv_vault_name }}' may not be the vault holding the
          Hammerspace credential. Across subscriptions:
            az keyvault secret list --vault-name <other-vault> --query "[].name" -o tsv
        - SOFT-DELETED. A deleted-but-recoverable secret is invisible to a
          normal get and must be restored:
            az keyvault secret list-deleted --vault-name {{ _hs_kv_vault_name }} --query "[].name" -o tsv
            az keyvault secret recover --vault-name {{ _hs_kv_vault_name }} --name {{ hammerspace_keyvault_secret_name }}
        - WRONG SUBSCRIPTION for the az CLI, if the list above comes back empty
          while the portal shows the secret:
            az account show --query name -o tsv
  when: (_hs_kv_secret.secrets | default([])) | length == 0

- name: Use the Key Vault secret as the Hammerspace API password
  ansible.builtin.set_fact:
    hammerspace_api_password: "{{ _hs_kv_secret.secrets[0].secret }}"
  no_log: true

# Confirms the override happened without ever revealing the value. Length is
# reported so an operator can tell an empty or truncated secret from a good one.
- name: Confirm the password came from Key Vault
  ansible.builtin.debug:
    msg: >-
      Hammerspace API password loaded from Key Vault
      ({{ hammerspace_keyvault_uri }}, secret '{{ hammerspace_keyvault_secret_name }}',
      {{ hammerspace_api_password | length }} chars). vars/vault.yml is ignored
      for this run.
